# Local development: API + Qdrant.  Start with `make up`, then `make ingest`.
services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]

  api:
    build: .
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    ports: ["8000:8000"]
    depends_on: [qdrant]
    volumes:
      - ./knowledge:/app/knowledge:ro      # edit content without rebuilding
      - ./config:/app/config:ro

  # Static test page that embeds the widget like your website will: http://localhost:8080
  demo:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: ["./demo:/usr/share/nginx/html:ro"]

volumes:
  qdrant_data:
