# Small-server mode (servers with less than 3 GB RAM). Applied automatically by deploy/k3s/deploy.sh,
# locally with: make helm-local SMALL=1
#
# Saves memory by
#   - indexing knowledge/ inside the API pod at startup (no second process loading the embedding model)
#   - stopping the old API pod before the new one starts (no two API pods at once)
#   - tighter memory requests/limits for the API and Qdrant
# Trade-off: about 30 to 60 seconds downtime during each deploy.

# Old pod stops before the new one starts. Same effect as "Recreate" with one replica, but stays a
# RollingUpdate, so an existing deployment can switch between normal and small mode without errors.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

ingestJob:
  enabled: false

config:
  INGEST_ON_START: "true"

startupProbe:
  failureThreshold: 60        # x 5 s = 5 min: indexing and waiting for Qdrant happen before the API starts

resources:
  requests: { cpu: 50m, memory: 384Mi }
  limits: { memory: 900Mi }

qdrant:
  resources:
    requests: { cpu: 25m, memory: 96Mi }
    limits: { memory: 384Mi }
