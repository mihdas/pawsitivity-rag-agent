{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "paws.secretName" . }}
  labels: {{- include "paws.labels" . | nindent 4 }}
type: Opaque
stringData:
  ANTHROPIC_API_KEY: {{ required "Set secrets.anthropicApiKey or secrets.existingSecret" .Values.secrets.anthropicApiKey | quote }}
{{- end }}
