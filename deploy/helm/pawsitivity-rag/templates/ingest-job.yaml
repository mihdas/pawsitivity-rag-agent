{{- if .Values.ingestJob.enabled }}
# Runs after every `helm install/upgrade` and rebuilds the vector index from the knowledge/ folder in the image.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "paws.fullname" . }}-ingest
  labels: {{- include "paws.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation   # keep the finished Job so its logs can be checked
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "paws.selector" . | nindent 8 }}
        app.kubernetes.io/component: ingest
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: ingest
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "scripts.ingest"]
          {{- include "paws.env" . | nindent 10 }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
