apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "paws.fullname" . }}
  labels: {{- include "paws.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- if .Values.qdrant.enabled }}
  QDRANT_URL: {{ include "paws.qdrantUrl" . | quote }}
  {{- end }}
