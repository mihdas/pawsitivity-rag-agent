apiVersion: v1
kind: Service
metadata:
  name: {{ include "paws.fullname" . }}
  labels: {{- include "paws.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "paws.selector" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
